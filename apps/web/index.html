<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- El icono es solo la bola del logotipo, sin el nombre debajo: a 32
         pixeles el texto no se lee y lo unico que hace es encoger el dibujo. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />

    <!-- La letra de la pagina, pedida antes de que el navegador la descubra en
         la hoja de estilos. Sin esto el primer dibujado sale con la del sistema
         y cambia a la vista, que en la pantalla de carga se nota. -->
    <link
      rel="preload"
      href="/fuentes/pixelify-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Pokemeeting</title>
    <meta
      name="description"
      content="Juega a Pokemon con alguien: cada uno con su propia partida, viendo la del otro en directo y hablando por voz."
    />
    <!-- El mismo fondo que la pagina, para que el navegador no pinte una franja
         blanca encima en el movil. -->
    <meta name="theme-color" content="#0b0f14" />

    <meta property="og:title" content="Pokemeeting" />
    <meta
      property="og:description"
      content="Juega a Pokemon con alguien: cada uno con su propia partida, viendo la del otro en directo."
    />
    <meta property="og:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
