# La app de Android, compilada en cada cambio que la toque.
#
# Se compila aqui y no en el ordenador de nadie porque hace falta el SDK y el
# NDK de Android, que las maquinas de GitHub ya traen. La APK queda como
# artefacto de la ejecucion: se descarga desde la pestaña Actions y se instala
# en el telefono.
#
# Es una APK "release" firmada con la clave de depuracion del proyecto: lleva el
# JavaScript dentro -no necesita un ordenador al lado- pero no es para la
# tienda. Para publicarla haria falta una clave propia.
#
# Al lado sale la APK de desarrollo (el "dev client" de Expo): no lleva el
# JavaScript, lo pide a `npx expo start` en el ordenador. Sirve para probar en
# el telefono y ver cada cambio al momento sin volver a compilar. Ver
# movil/README.md.
name: APK Android

on:
  push:
    paths:
      - 'movil/**'
      - 'packages/**'
      - 'apps/web/src/core/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: movil/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias de la app
        working-directory: movil
        run: npm ci

      - name: Tipos
        working-directory: movil
        run: npx tsc --noEmit

      - name: Compilar la APK
        working-directory: movil/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pokemeeting-apk
          path: movil/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Compilar la APK de desarrollo
        working-directory: movil/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pokemeeting-dev-client-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
